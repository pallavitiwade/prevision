
<div class="container mt-5">
    <div class="row">
        <div class="col-md-6 offset-3">
            <div class="card">
                <h2 class="text-center mt-2">Add Card</h2>
                <div class="card-body">
                    <div class="form-group">
                        <label for="title">Title</label>
                        <input type="text" #title class="form-control">
                    </div>
                    <div class="form-group">
                        <label for="body">Body</label>
                        <textarea rows="4" type="text" #body class="form-control"></textarea>
                    </div>
                    <div class="form-group">
                        <select #userId class="form-control">
                            <option value="1">1</option>
                            <option value="2">2</option>
                            <option value="3">3</option>
                            <option value="4">4</option>
                            <option value="5">5</option>

                            
                        </select>
                    </div>
                    <div class="card-footer">
                        <button (click)="onAdd(title,body,userId)" *ngIf="!isInEditMode" class="btn btn-block bg-primary text-light">Add Card</button>
                        <button (click)="onUpdate()" *ngIf="isInEditMode" class="btn btn-block bg-primary text-light">Update Card</button>

                    </div>
                    
                </div>
            </div>
        </div>
    </div>



    <div class="row mt-5">
        <div class="col-md-4" *ngFor="let post of blogsArr">
            <div class="card-header mt-5">
                <h4>{{post.title}}</h4>
            </div>
            <div class="card-body">
                <p>{{post.body}}</p>
            </div>
            <div class="card-footer d-flex justify-content-between">
                <button (click)="onEdit(post)" class="btn btn-sm bg-primary">Edit</button>
                <button (click)="onRemove(post.id)" class="btn btn-sm bg-danger">Remove</button>

            </div>
        </div>
    </div>
</div>
