
<div class="coffee-page">
    <div class="container-fluid">
    <div class="row row no-gutters align-items-stretch">
    <div class="col-lg-6" *ngFor="let pro of products">
        <div class="hero-content">
    <h3>Black <span>Coffee</span>{{pro.name}}</h3>
    <p class="hero-description">{{pro.description }} </p>
    </div>
    <div class="col-lg-6">
        <div class="hero-image">
           <img
                [src]="pro.image"
                [alt]="pro.name">

        </div>
        
    </div>

    </div>
</div>
</div>
